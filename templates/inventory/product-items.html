<!-- เลขครุภัณฑ์ของพัสดุหนึ่งรายการ — ระบบเดิมคือ module=inventory-write&tab=items
     ตารางแก้ไขทั้งตารางแล้วกดบันทึกครั้งเดียว (เพิ่ม/ลบแถวได้) เหมือนหน้าหมวดหมู่
     คอลัมน์มาจากฝั่ง PHP เพราะต้องวาดรูปบาร์โค้ดของแต่ละรหัสมาให้ด้วย -->
<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <form data-form="inventoryItems" action="api/inventory/items/save" method="post" data-ajax-submit="true"
            data-load-api="api/inventory/items/get" data-load-query-params="true" autocomplete="off">
        <div class="card-groups">
          <header>
            <div>
              <h1 class="icon-barcode" data-text="topic"></h1>
              <p data-i18n>One item can hold many serial numbers, each with its own quantity</p>
            </div>
            <div>
              <a class="btn icon-arrow-left" data-attr="href:'/inventory-write?id=' + id" data-i18n>{LNG_Back}</a>
            </div>
          </header>
          <div class="content-body">
            <fieldset class="grid">
              <div class="tablebody">
                <table class="table border fullwidth" data-table="inventoryItems" data-editable-rows="true"
                       data-attr="data:options" data-dynamic-columns="true">
                  <tbody></tbody>
                </table>
              </div>
            </fieldset>
            <fieldset class="submit">
              <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
              <input type="hidden" name="id" data-attr="value:id">
            </fieldset>
          </div>
        </div>
      </form>
    </main>
  </div>
</div>
